function now(){return Date.now();}
function uid(){return Math.random().toString(36).slice(2,9);}
function seed(){
  var t=now(); var st=[];
  ["wolf","crow","cow","sheep","tiger"].forEach(function(id,i){st.push({id:id,desk:i,energy:85-i*4,mood:70+i*3,at:t});});
  return {v:1,coins:200,totalDone:0,savedAt:t,upgrades:{},staff:st,
    tasks:[
      {id:uid(),title:"口播影片製作",cat:"design",status:"todo",assignee:null,c:t},
      {id:uid(),title:"IG 留言檢查",cat:"misc",status:"todo",assignee:null,c:t},
      {id:uid(),title:"Threads 貼文",cat:"write",status:"doing",assignee:"wolf",c:t},
      {id:uid(),title:"資安電子報",cat:"write",status:"done",assignee:"wolf",c:t,d:t,r:150}
    ],
    news:["【開張】社畜辦公室正式營運，老闆就是你","【提醒】把真實待辦丟進看板，派給員工吧"]};
}
var S;
try{ S = JSON.parse(document.getElementById("state").textContent); }catch(e){ S=null; }
var SEEDED=false;
if(!S||!S.staff){ S = seed(); SEEDED=true; }

var RATE = function(){ var u=S.upgrades||{}; return {e:8+(u.coffee?8:0), m:5+(u.plant?3:0)+(u.vending?3:0)}; };
function eff(s){
  var h=(now()-s.at)/3600000, r=RATE();
  var e=s.energy+h*(r.e+(S.upgrades.sofa&&s.energy<20?5:0));
  return {energy:Math.max(0,Math.min(100,e)), mood:Math.max(0,Math.min(100,s.mood+h*r.m))};
}
function normalize(){ S.staff.forEach(function(s){var f=eff(s);s.energy=f.energy;s.mood=f.mood;s.at=now();}); }
function staffById(id){ for(var i=0;i<S.staff.length;i++) if(S.staff[i].id===id) return S.staff[i]; return null; }
function doingOf(id){ return S.tasks.filter(function(t){return t.status==="doing"&&t.assignee===id;}); }
function guessCat(title){
  var t=title.toLowerCase();
  if(/影片|剪|設計|圖|海報|logo|封面|ui|版面|視覺/.test(t)) return "design";
  if(/code|repo|bug|程式|api|部署|網站|資料庫|修|git|腳本|自動化/.test(t)) return "tech";
  if(/寫|文|貼文|稿|文案|threads|blog|電子報|信|email|翻譯/.test(t)) return "write";
  if(/企劃|提案|會議|規劃|簡報|策略|計畫|報告|預算/.test(t)) return "plan";
  return "misc";
}
function bestFor(cat){
  var best=null,score=-1e9;
  S.staff.forEach(function(s){ var f=eff(s); var sc=(ROSTER[s.id].skills.indexOf(cat)>=0?60:0)+f.energy*0.5+f.mood*0.2-doingOf(s.id).length*25; if(sc>score){score=sc;best=s;} });
  return best;
}

/* ---------- persistence ---------- */
var art=null, saveTimer=null, mode="local";
function buildHTML(){
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  var app=document.getElementById("app-js").textContent;
  return "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>社畜辦公室 CAM 01</title>\n</head>\n<body>\n<script type=\"application/json\" id=\"state\">"+json+"<\/script>\n<script id=\"app-js\">"+app+"<\/script>\n</body>\n</html>";
}
function save(){
  S.savedAt=now();
  try{ localStorage.setItem("office-boss-v1",JSON.stringify(S)); }catch(e){}
  if(!art) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    toast("儲存中…");
    art.publish(buildHTML()).catch(function(err){
      var c=err&&err.code;
      if(c==="not_granted"||c==="not_writer"){ art=null; toast("唯讀模式：變更不會儲存"); }
      else if(c!=="conflict"){ toast("儲存失敗，稍後再試"); }
    });
  },1500);
}
function mutate(fn){ normalize(); fn(); render(); save(); }

/* ---------- behaviour ---------- */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function spotFor(s){
  var u=S.upgrades||{}, keys=["window","board","shelf","pantry","wander","wander"];
  if(u.vending) keys.push("vending","vending");
  if(u.sofa) keys.push("sofa");
  return pick(SPOTS[pick(keys)]);
}
function desired(s){
  var f=eff(s), a=actors[s.id], d=DESKS[s.desk];
  if(a.cheer>performance.now()) return {mode:"cheer"};
  if(f.energy<20){ if(S.upgrades.sofa) return {mode:"sleep",x:SPOTS.sofa[s.desk%2][0],y:SPOTS.sofa[s.desk%2][1]}; return {mode:"sleep",x:d[0]-20,y:d[1]-18}; }
  if(doingOf(s.id).length) return {mode:"work",x:d[0]-20,y:d[1]-18};
  return {mode:"idle"};
}
function think(t){
  S.staff.forEach(function(s){
    var a=actors[s.id]; if(!a) return;
    var want=desired(s);
    if(want.mode==="cheer"){ a.mode="cheer"; return; }
    if(want.mode==="idle"){
      if(a.mode!=="idle"||t>a.next){ var p=spotFor(s); a.tx=p[0]+(Math.random()*30-15); a.ty=p[1]+(Math.random()*16-8); a.next=t+7000+Math.random()*9000; }
      a.mode="idle";
    } else { a.mode=want.mode; a.tx=want.x; a.ty=want.y; }
  });
}
var LINES={
  work:["「{t}」快好了啦，大概","這個「{t}」誰訂的期限？","先做再說，Ctrl+S 按到手酸","交了，開會時再被改一次。","我正在跟「{t}」培養感情","進度 87%，跟昨天一樣","別吵，我在心流"],

function line(id){
  var s=staffById(id), a=actors[id], f=eff(s), d=doingOf(id), pool;
  if(a.mode==="sleep") pool=LINES.sleep;
  else if(a.mode==="cheer") pool=LINES.cheer;
  else if(f.mood<30) pool=LINES.sad;
  else if(d.length>=3) pool=LINES.busy;
  else if(a.mode==="work") pool=LINES.work;
  else pool=LINES.idle;
  var t=d.length?pick(d).title:"";
  return pick(pool).replace("{t}",t.length>10?t.slice(0,10)+"…":t).replace("{n}",d.length);
}

var nextChat=0, aiQueue=[];
function chatter(t){
  if(t<nextChat) return;
  if(aiQueue.length){ var q=aiQueue.shift(); say(q.id,q.line,4500); nextChat=t+3600; return; }
  var free=S.staff.filter(function(s){return bubbles[s.id]&&bubbles[s.id].until<t;});
  var on=S.staff.filter(function(s){return bubbles[s.id]&&bubbles[s.id].until>=t;});
  if(free.length&&on.length<2){ var s=pick(free); say(s.id,line(s.id)); }
  nextChat=t+3500+Math.random()*4000;
}

/* ---------- loop ---------- */
var last=0, lastThink=0, tickX=650;
function frame(t){
  var dt=Math.min(0.05,(t-last)/1000||0); last=t;
  if(t-lastThink>800){ think(t); chatter(t); lastThink=t; }
  var list=[];
  S.staff.forEach(function(s){
    var a=actors[s.id]; if(!a||!a.g) return;
    var moving=false;
    if(a.tx!=null&&a.mode!=="cheer"){ var dx=a.tx-a.x, dy=a.ty-a.y, dist=Math.hypot(dx,dy);
      if(dist>2){ var sp=110*dt; a.x+=dx/dist*Math.min(sp,dist); a.y+=dy/dist*Math.min(sp,dist); moving=true; if(Math.abs(dx)>1) a.face=dx>0?1:-1; } }
    var sleeping=a.mode==="sleep"&&!moving;
    if(a.sleepDrawn!==sleeping){ a.inner.innerHTML=charSVG(s.id,sleeping); a.sleepDrawn=sleeping; }
    var oy=0;
    if(moving) oy=-Math.abs(Math.sin(t/90))*4;
    else if(a.mode==="cheer") oy=-Math.abs(Math.sin(t/140))*20;
    else if(a.mode==="work") oy=Math.sin(t/120)*1.2;
    else if(sleeping) oy=Math.sin(t/700)*1.5;
    var sc=0.95+(a.y-330)/370*0.3;
    a.g.setAttribute("transform","translate("+a.x.toFixed(1)+","+(a.y+oy).toFixed(1)+") scale("+(sc*a.face).toFixed(3)+","+sc.toFixed(3)+")");
    a.z.textContent=sleeping?("Z".repeat(1+Math.floor(t/600)%3)):"";
    a.z.setAttribute("transform","scale("+a.face+",1)");
    a.g._y=a.y; list.push(a.g);
    var b=bubbles[s.id]; if(b){ if(b.until<t) b.el.classList.remove("on"); b.el.style.left=(a.x/10)+"%"; b.el.style.top=((a.y-100*sc-6)/7)+"%"; }
  });
  list=list.concat(deskNodes,propNodes).sort(function(p,q){return p._y-q._y;});
  for(var i=0;i<list.length;i++) actorLayer.appendChild(list[i]);
  // ticker
  var tk=document.getElementById("ticker"); if(tk){ tickX-=40*dt; var w=tk.getComputedTextLength?tk.getComputedTextLength():600; if(tickX< 489-w) tickX=650; tk.setAttribute("x",tickX.toFixed(1)); }
  requestAnimationFrame(frame);
}

  if(!list.length) H+='<div class="empty">'+(tab==="todo"?"沒有待辦，老闆可以下班了 🎉":tab==="doing"?"沒人在工作…先去「待辦」指派任務":"還沒有完成的任務")+'</div>';
  list.forEach(function(t){
    var c=CATS[t.cat]||CATS.misc, s=t.assignee?staffById(t.assignee):null;
    H+='<div class="task" style="border-left-color:'+c.c+'"><div class="t">'+esc(t.title)+'</div><div class="m"><span>'+c.e+' '+c.n+'</span>';
    if(t.assignee&&ROSTER[t.assignee]) H+='<span style="display:flex;align-items:center;gap:4px">'+avatar(t.assignee)+ROSTER[t.assignee].name+'</span>';
    if(t.status==="done") H+='<span>+$'+(t.r||0)+'</span>';
    H+='</div><div class="a">';
    if(t.status==="todo"){ H+='<button class="btn sm dark" data-act="pick" data-id="'+t.id+'">👉 指派</button><button class="btn sm" data-act="auto" data-id="'+t.id+'">🤖 交給最適合的</button><button class="btn sm" data-act="del" data-id="'+t.id+'">✕</button>'; }
    else if(t.status==="doing"){ H+='<button class="btn sm dark" data-act="done" data-id="'+t.id+'">✓ 我做完了</button><button class="btn sm" data-act="back" data-id="'+t.id+'">退回待辦</button>'; }
    else { H+='<button class="btn sm" data-act="del" data-id="'+t.id+'">刪除</button>'; }
    H+='</div>';
    if(openPick===t.id){
      var best=bestFor(t.cat);
      H+='<div class="pick">'+S.staff.map(function(st){var f=eff(st); var r=ROSTER[st.id]; return '<button data-act="assign" data-id="'+t.id+'" data-s="'+st.id+'" class="'+(best&&best.id===st.id?'best':'')+'">'+avatar(st.id)+r.name+(r.skills.indexOf(t.cat)>=0?' ⭐':'')+(f.energy<20?' 😴':'')+'</button>';}).join('')+'</div>';
    }
    H+='</div>';
  });
  H+='</div>';
  // staff
  H+='<div class="panel"><h3>🐾 員工狀態</h3><div class="staff">'+S.staff.map(function(st){
    var f=eff(st), r=ROSTER[st.id], d=doingOf(st.id).length;
    return '<div class="card">'+avatar(st.id)+'<div style="flex:1;min-width:0"><div class="n">'+r.name+' <span class="r">'+r.role+'</span></div><div class="r">擅長 '+r.skills.map(function(k){return CATS[k].e;}).join('')+'・手上 '+d+' 件</div>'+
      '<div class="meter" title="體力"><i style="width:'+f.energy.toFixed(0)+'%;background:#ef6b5b"></i></div><div class="meter" title="心情"><i style="width:'+f.mood.toFixed(0)+'%;background:#f2b84b"></i></div></div></div>';
  }).join('')+'</div><div class="note">紅條＝體力（完成任務會消耗，隨時間恢復），黃條＝心情（工作量太多會下降）。派給擅長的員工 ⭐ 賺比較多。</div></div>';
  // shop
  H+='<div class="panel"><h3>🛒 辦公室升級</h3><div class="shop">'+SHOP.map(function(it){
    var own=!!u[it.id];
    return '<div class="item"><div class="n">'+it.n+'</div><p>'+it.d+'</p>'+(own?'<button class="btn sm" disabled>已擁有</button>':'<button class="btn sm dark" data-act="buy" data-id="'+it.id+'"'+(S.coins<it.p?' disabled':'')+'>$'+it.p+'</button>')+'</div>';
  }).join('')+'</div></div>';
  H+='<div class="note" id="modeNote">'+(mode==="artifact"?"資料會存在這個頁面裡，換裝置打開也看得到。":"資料存在這台裝置的瀏覽器裡（換裝置或清除瀏覽器資料就會不見）。")+'</div>';
  document.getElementById("ui").innerHTML=H;
  var b=document.getElementById("aiBtn"); if(b&&!sampler) b.style.display=samplerChecked?"none":"";
}
function render(){ renderBoard(); renderTV(); renderUI(); var lu=document.getElementById("lu"); if(lu){ var d=tpe(new Date(S.savedAt||now())); lu.textContent=pad(d.getHours())+":"+pad(d.getMinutes()); } }

function addNews(m){ S.news=(S.news||[]); S.news.push(m); if(S.news.length>8) S.news=S.news.slice(-8); }
function assign(tid,sid){
  var t=S.tasks.filter(function(x){return x.id===tid;})[0]; if(!t) return;
  var st=staffById(sid), r=ROSTER[sid], n=doingOf(sid).length;
  mutate(function(){
    t.assignee=sid; t.status="doing"; openPick=null;
    if(n>=2){ st.mood=Math.max(0,st.mood-10); }
  });
  var f=eff(st);
  if(f.energy<20) say(sid,"我都睡著了你還派…好啦醒來做");
  else if(n>=2) say(sid,"一次塞我 "+(n+1)+" 件，你認真？");
  else if(r.skills.indexOf(t.cat)>=0) say(sid,"「"+(t.title.length>10?t.title.slice(0,10)+"…":t.title)+"」交給我！");
  else say(sid,"這不是我專長欸…但好吧");
}
function complete(tid){
  var t=S.tasks.filter(function(x){return x.id===tid;})[0]; if(!t) return;
  var sid=t.assignee, st=staffById(sid), r=ROSTER[sid], f=eff(st);
  var match=r.skills.indexOf(t.cat)>=0;
  var reward=100+(match?50:0); if(f.mood<30) reward=Math.round(reward*0.7);
  mutate(function(){
    t.status="done"; t.d=now(); t.r=reward;
    S.coins+=reward; S.totalDone+=1;
    st.energy=Math.max(0,st.energy-(match?6:12)); st.mood=Math.min(100,st.mood+8);
    addNews("【快訊】"+r.name+"完成「"+t.title+"」，公司進帳 $"+reward);
    var done=S.tasks.filter(function(x){return x.status==="done";});
    if(done.length>30){ var drop=done[0].id; S.tasks=S.tasks.filter(function(x){return x.id!==drop;}); }
  });
  actors[sid].cheer=performance.now()+2500;
  say(sid,pick(LINES.cheer)+"  +$"+reward);
  toast("🎉 +$"+reward+(match?"（專長加成）":""));
}
function buy(id){
  var it=SHOP.filter(function(x){return x.id===id;})[0]; if(!it||S.coins<it.p) return;
  mutate(function(){
    S.coins-=it.p; S.upgrades[id]=true;
    if(id==="hire") S.staff.push({id:"penguin",desk:5,energy:100,mood:90,at:now()});
    addNews("【公司動態】老闆買了"+it.n.replace(/^\S+\s/,"")+"，員工士氣大振");
  });
  buildScene(); render();
  toast("已購買 "+it.n);
  if(id==="hire") setTimeout(function(){ say("penguin","大家好！我是新來的實習生企企！"); },400);
}

function bindUI(){
  var ui=document.getElementById("ui");
  ui.addEventListener("submit",function(e){
    e.preventDefault();
    var i=document.getElementById("addI"), v=i.value.trim(); if(!v) return;
    var cat=newCat||guessCat(v);
    mutate(function(){ S.tasks.push({id:uid(),title:v,cat:cat,status:"todo",assignee:null,c:now()}); tab="todo"; });
    toast("已加入待辦（"+CATS[cat].e+CATS[cat].n+"）");
    var ni=document.getElementById("addI"); if(ni) ni.focus();
  });
  ui.addEventListener("click",function(e){
    var el=e.target.closest("[data-cat],[data-tab],[data-act],#aiBtn"); if(!el) return;
    if(el.id==="aiBtn"){ meeting(); return; }
    if(el.hasAttribute("data-cat")){ newCat=el.getAttribute("data-cat")||null; renderUI(); return; }
    if(el.hasAttribute("data-tab")){ tab=el.getAttribute("data-tab"); openPick=null; renderUI(); return; }
    var act=el.getAttribute("data-act"), id=el.getAttribute("data-id");
    if(act==="pick"){ openPick=openPick===id?null:id; renderUI(); }
    else if(act==="assign") assign(id,el.getAttribute("data-s"));
    else if(act==="auto"){ var t=S.tasks.filter(function(x){return x.id===id;})[0]; var b=bestFor(t.cat); if(b) assign(id,b.id); }
    else if(act==="done") complete(id);
    else if(act==="back") mutate(function(){ var t=S.tasks.filter(function(x){return x.id===id;})[0]; t.status="todo"; t.assignee=null; });
    else if(act==="del") mutate(function(){ S.tasks=S.tasks.filter(function(x){return x.id!==id;}); });
    else if(act==="buy") buy(id);
  });
}

/* ---------- AI meeting ---------- */
var sampler=null, samplerChecked=false, meetingBusy=false;
function meeting(){
  if(!sampler){ toast("這個檢視無法使用 AI 晨會"); return; }
  if(meetingBusy) return; meetingBusy=true;
  var b=document.getElementById("aiBtn"); if(b){ b.disabled=true; b.textContent="🎤 開會中…"; }
  var lines=S.staff.map(function(s){var r=ROSTER[s.id], f=eff(s), d=doingOf(s.id).map(function(t){return t.title;}); return "- id="+s.id+"｜"+r.name+"（"+r.animal+"，"+r.role+"）｜體力"+Math.round(f.energy)+" 心情"+Math.round(f.mood)+"｜手上任務："+(d.length?d.join("、"):"無");}).join("\n");
  var todo=S.tasks.filter(function(t){return t.status==="todo";}).map(function(t){return t.title;}).join("、")||"無";
  var prompt="你是一部辦公室情境喜劇的編劇。這間公司的員工都是動物，老闆是使用者本人，任務是老闆真實生活中的待辦。\n"+
    "請替每位員工寫一句晨會台詞：繁體中文、台灣職場口語、幽默帶點厭世吐槽但不刻薄，每句不超過22個字，盡量提到他手上的任務；沒任務的人可以搶工作、摸魚或吐槽待辦清單。體力低的人要很睏，心情低的人要很喪。\n"+
    "另外寫一則電視快訊標題（不超過24字），總結今天公司狀況。\n"+
    "員工：\n"+lines+"\n尚未指派的待辦："+todo+"\n\n"+
    '只回傳 JSON：{"lines":[{"id":"員工id","line":"台詞"}],"news":"快訊"}';
  sampler.json(prompt,{modelTier:"quick"}).then(function(res){
    var arr=(res&&res.lines)||[];
    arr.forEach(function(x){ if(x&&ROSTER[x.id]&&staffById(x.id)&&x.line) aiQueue.push({id:x.id,line:String(x.line).slice(0,40)}); });
    nextChat=0;
    if(res&&res.news){ addNews("【晨會】"+String(res.news).slice(0,40)); renderTV(); save(); }
    toast("晨會開始！看看大家說什麼");
  }).catch(function(err){
    if(err&&err.code==="not_granted"){ sampler=null; toast("沒有權限使用 AI"); }
    else if(err&&err.code==="rate_limited") toast("太頻繁了，等一下再開會");
    else toast("晨會失敗了，等等再試");
  }).then(function(){ meetingBusy=false; var b=document.getElementById("aiBtn"); if(b){ b.disabled=false; b.textContent="🎤 開晨會"; } });
}

function useCap(name){ try{ return (window.claude&&window.claude.use)?window.claude.use(name):Promise.resolve(null); }catch(e){ return Promise.resolve(null); } }
useCap("artifact").then(function(a){
  art=a||null; mode=art?"artifact":"local";
  if(!art){ try{ var L=JSON.parse(localStorage.getItem("office-boss-v1")||"null"); if(L&&L.staff&&(SEEDED||(L.savedAt||0)>(S.savedAt||0))){ S=L; actors={}; bubbles={}; document.getElementById("bubs").innerHTML=""; buildScene(); } }catch(e){} }
  render();
}).catch(function(){});
useCap("sample").then(function(s){ sampler=s||null; samplerChecked=true; renderUI(); }).catch(function(){ samplerChecked=true; renderUI(); });
})();
